[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-embodied-runtime"
version = "0.1.0"
description = "Plugin-centric embodied policy runtime with robot I/O abstractions and ZMQ policy RPC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1.3",
    "numpy>=1.26",
    "pydantic>=2.6,<3",
    "pyserial>=3.5,<4",
    "pyzmq>=25,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
[project.scripts]
policy-runtime-host = "policy_embodied_runtime.apps.runtime_host:main"
policy-soarm101-command-publisher = "policy_embodied_runtime.apps.soarm101_command_publisher:main"
policy-soarm101-sim = "policy_embodied_runtime.sim.soarm101.cli:main"
policy-soarm101-verify-serial = "policy_embodied_runtime.sim.soarm101.verify_serial:main"
policy-openarm-sim = "policy_embodied_runtime.sim.openarm.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"policy_embodied_runtime.sim.soarm101_assets" = [
    "robotstudio_so101/LICENSE",
    "robotstudio_so101/README.md",
    "robotstudio_so101/*.xml",
    "robotstudio_so101/assets/*.stl",
]

[tool.setuptools.packages.find]
include = [
    "policy_embodied_runtime",
    "policy_embodied_runtime.*",
]

[tool.pytest.ini_options]
testpaths = [
    "policy_embodied_runtime/tests",
]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "tcp_smoke: explicitly enabled TCP smoke tests for real subprocess and CLI validation",
]
